<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>La biblioteca de Ilary</title>
  <meta name="description" content="Biblioteca digital personal: libros leídos, leyendo y por leer.">
  <meta name="theme-color" content="#e6e0d8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1a1816" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Biblioteca">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="top">
    <label class="search-pill glass">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="m16 16 4 4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
      <input id="q" type="search" placeholder="Buscar" autocomplete="off" aria-label="Buscar en la biblioteca">
      <span class="pill-label">Biblioteca de Ilary</span>
    </label>
    <button class="icon-btn" id="viewBtn" aria-label="Cambiar vista"></button>
    <button class="avatar" id="menuBtn" aria-label="Menú">I<span id="sync" class="sync" role="status" aria-live="polite"></span></button>
  </header>

  <main id="view" class="view"></main>

  <button id="timerPill" class="timer-pill" hidden aria-label="Volver a la sesión de lectura"></button>

  <nav class="nav" aria-label="Principal">
    <a href="#/shelf/all" data-nav="shelf">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h4v16H4zM10 4h4v16h-4zM16.5 5.2l3.8-1 3.4 15.4-3.8 1z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
      <span>Biblioteca</span>
    </a>
    <a href="#/stats" data-nav="stats">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V11M12 20V5M19 20v-6" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg>
      <span>Estadísticas</span>
    </a>
    <a href="#/add" data-nav="add">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M12 8v8M8 12h8" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
      <span>Agregar</span>
    </a>
  </nav>

  <dialog id="sheet" class="sheet"></dialog>
  <dialog id="keyDlg" class="sheet"></dialog>

  <dialog id="scanDlg" class="sheet">
    <div class="sheet-inner">
      <button class="close" data-close aria-label="Cerrar">×</button>
      <h2 class="sheet-title">Cámara</h2>
      <div id="reader" class="reader"></div>
      <p id="scanMsg" class="muted center">Iniciando cámara…</p>
      <div class="cam-actions">
        <button type="button" class="btn primary" id="snapBtn">📷 Foto de la portada</button>
        <label class="btn">Galería<input type="file" accept="image/*" id="camFile" hidden></label>
      </div>
      <form id="isbnForm" class="searchbar">
        <input name="isbn" inputmode="numeric" placeholder="O escribe el ISBN" autocomplete="off">
        <button class="btn primary">Buscar</button>
      </form>
    </div>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="/app.js" type="module"></script>
</body>
</html>
